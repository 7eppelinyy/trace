# ============================================================
# 集中配置文件：所有阈值/权重必须在此管理，禁止散落硬编码
# ============================================================

database:
  path: data/trace.db

# SEC 公平访问：User-Agent = "公司名 联系邮箱"（可用环境变量 SEC_COMPANY_NAME / SEC_CONTACT_EMAIL 覆盖）
sec_contact:
  company_name: TraceEventRadar
  contact_email: research@example.com

llm:
  provider: gemini        # 默认优先 Gemini；环境变量 LLM_PROVIDER 可覆盖（gemini | openai）
  # 具体 API Key 从 .env 读取（GEMINI_API_KEY / OPENAI_API_KEY），此处只配置模型名
  models:
    gemini:
      event_extractor: gemini-2.0-flash
      impact_analyzer: gemini-2.0-flash
      same_event_verifier: gemini-2.0-flash
    openai:
      event_extractor: gpt-4o-mini
      impact_analyzer: gpt-4o-mini
      same_event_verifier: gpt-4o-mini
  temperature: 0.0
  # 每日真实 API 调用上限（UTC 日切，含重试消耗的每一次）。0 = 不限制。
  # 事前熔断，防止来源改版导致去重穿透后配额被一夜打光；超限本轮返回
  # STOP_LLM_BUDGET_EXCEEDED，不得静默降级成 rule_based_degraded。
  # 参考量级：首次全量回填一轮约 400 次（222 Stage A + 160 Stage B + 26 verifier），
  # 稳态每轮远低于此。3000 留了足够余量，同时能挡住数量级级别的失控。
  daily_call_budget: 3000

ai:
  # 仅补充佐证的合并（事件无实质更新、version 不变）是否重跑 Stage B。
  # 默认 false：重算结果会被 Alert 幂等键拦下，用户看不到变化，
  # 却真实消耗一次 LLM 调用。事件尚无任何分析结果时仍会补跑（不受此开关影响）。
  reanalyze_on_non_material_merge: false

embedding:
  # 跨语言聚类使用；开发/离线环境可切到 hash 伪向量
  provider: sentence-transformers
  model: paraphrase-multilingual-MiniLM-L12-v2
  # provider: hash 时使用
  hash_dim: 256

event_engine:
  merge_weights:
    title_semantic_similarity: 0.35
    summary_semantic_similarity: 0.25
    entity_overlap: 0.20
    event_type_match: 0.10
    time_proximity: 0.10
  merge_thresholds:
    auto_merge: 0.82
    verifier_min: 0.72   # 0.72–0.82 交给 LLM same-event verifier
    # < 0.72 创建新 Event
  # 同一事件时间窗口（小时），超出窗口不参与聚类
  time_window_hours: 72

scoring:
  # base_score = w1*source_reliability + w2*directness + w3*magnitude + w4*persistence
  base_weights:
    source_reliability: 0.22
    directness: 0.28
    magnitude: 0.30
    persistence: 0.20
  # final_score = clamp(base_score + market_confirmation_weight*(market_confirmation-5), 1, 10)
  market_confirmation_weight: 0.15
  # 供需景气确定性信号权重（trace/scoring/signals.py，5=中性不加减分）
  supply_demand_weight: 0.10
  score_min: 1
  score_max: 10
  # 开盘后补算此前拿不到的市场确认（盘后/周末事件在分析当时被时段门禁判为
  # "市场还没开过盘"，只能取中性 5.0）。零 LLM 成本：base_score 已落库，
  # 供需信号是确定性函数，只有行情是新的。分数实质变化才升版本并再次评估投递。
  rescore_on_market_open: true

alerts:
  default_threshold: 6          # final_score >= 6 才即时提醒（用户级 __ALL__ 规则优先，见 alert_rule）
  minimum_confidence: 0.0       # 默认不设最低置信度（重要度/置信度分离）
  # 首次同步保护：只允许事件在 freshness_window_hours 内发生且
  # 晚于该用户的 alert_activation_at 才作为即时 Alert 推送，
  # 避免历史事件在用户注册时集中发送。
  freshness_window_hours: 168   # 7 天
  # 允许再次推送的 event revision 条件
  revision_resend_rules:
    - document_corrected
    - denial_or_retraction
    - rumor_to_confirmed
    - recovery_to_confirmed
    - official_source_appeared
    - direction_changed
    - key_number_changed
    - score_delta_ge_1
    - first_cross_threshold
  score_resend_delta: 1.0

markets:
  US:
    timezone: America/New_York
    sessions:
      - open: "09:30"
        close: "16:00"
    pre_market_open: "04:00"
    post_market_close: "20:00"
  CN:
    timezone: Asia/Shanghai
    sessions:
      - open: "09:30"
        close: "11:30"
      - open: "13:00"
        close: "15:00"
  # 事件后的市场反应观察窗口（分钟）
  reaction_window_minutes: 30
  # 市场确认的有效期（小时）：从「事件时刻（若当时开盘）或事件后首次开盘」起算，
  # 超过则当前报价不再算作对该事件的反应，市场确认返回中性 5.0。
  # 盘后/周末事件按"首次开盘"起算，不会因跨周末被误判为过期。
  confirmation_max_age_hours: 24
  # 行情缓存 TTL（秒）：同一轮里同一 ticker 会被 Stage B / 日报 / 回测反复请求
  quote_cache_ttl_seconds: 60

telegram:
  # run-once 验收投递的默认接收人（环境变量 TELEGRAM_DEFAULT_CHAT_ID 覆盖）
  default_user_timezone: Asia/Taipei

digest:
  enabled: true                 # 长驻循环到点自动推送每日摘要
  # 每日摘要生成时间（用户默认时区）
  send_time: "21:00"

forecast:
  # 预测回测账本：用「事件时刻锚点价 → horizon 小时后价格」的区间收益
  # 核对方向预测（/accuracy 查看）。锚点价来自 market_snapshot。
  enabled: true
  horizon_hours: 24
  move_threshold_pct: 1.0       # 区间收益超过 ±1% 才算有方向
  # 锚点快照与事件时间的最大允许偏差（小时）：超出则判为无法核对，
  # 不得用其他时刻的价格顶替事件时刻的价格
  anchor_tolerance_hours: 6
  # 超过 horizon 这么多小时仍未核对（如服务停机）→ 测到的已不是 horizon
  # 收益，落账为 unmeasurable 而不是当作有效样本
  max_delay_hours: 24

backup:
  # SQLite 每日备份（data/backups/，同一天一份）与轮换
  enabled: true
  keep: 7

ops:
  run_history_keep: 500         # run_history 表保留的最近轮数

collectors:
  # 并行采集线程数（1 = 串行；长驻 run/bot 循环生效）
  parallel_workers: 4
  # 采集间隔（秒），按 collector 类型；run-once 验收不受影响
  interval_seconds:
    sec: 300
    ir: 600
    sandisk_ir: 600
    micron_ir: 600
    cninfo: 300
    exchange_cn: 300
    policy: 600
    rss: 600
    industry_media: 600
    jin10: 120
    # 泛科技词表放宽后金十命中率上升，轮询调快以更快捕获新快讯
  # 金十数据（MCP 官方授权）采集配置
  jin10:
    keyword_filter: jin10        # Level 1 关键词初筛词表（source_filters.yaml）
    max_pages: 3                 # 每次采集最多翻页数（每页 20 条）
    max_items: 60                # 单轮最多进入下游的条目数（控 LLM 量）
    bootstrap_days: 7            # 首次接入只回填最近 N 天
  http:
    timeout_seconds: 30
    user_agent: "TraceEventRadar/0.1 (research use)"
