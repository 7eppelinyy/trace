# ============================================================
# 供需景气信号（Supply-Demand Signal） — 财报季方法论
# 单一真相源：Stage A 抽取指引 + Stage B 确定性评分因子共用此文件。
#
# 来源：a9 帖「财报季高效方法」——业绩大增公司财报/招股书里出现
#   「产品供不应求 / 行业高景气度上行 / 市场超预期拓展 / 新品上市持续
#    超预期 / 产品价格中枢持续上涨 / 供给偏紧 / 需求旺盛」→ 重点关注。
#
# 使用前提（重要，否则会反向）：本节是一阶「供需拐点」代理信号，
#   不是估值判断。对周期股而言，「价格中枢上涨/供给偏紧/缺货」这几个词
#   恰恰常出现在景气度顶部，紧接产能投放→价格回落→戴维斯双杀。
#   因此：
#   1. 它只对 final_score 做小幅对称调整（默认权重 0.10，见 scoring 段），
#      永远不能单凭它把事件定成利多——direction/影响方向由 Stage B 独立判定。
#   2. 词表做对称：同时识别「供给偏紧/涨价/缺货」与「供给过剩/降价/需求走弱」。
#   3. 只能当作引擎里一个客观的文字强度维度，不是投资结论。
# ============================================================

# 传给 Stage A Extractor 的抽取指引：让模型把供需/景气事实显式抽取进
# facts 与 key_numbers，便于下游确定性信号与人类复核。
focus_guidance: |
  附加抽取关注（供需/景气维度，财报季方法论）：
  在 facts 与 key_numbers 中，若原文涉及如下信号，请显式逐条记录其原文表述：
  - 供给侧：产品/产能供不应求、供给偏紧、缺货、满产、高产能利用率、扩产/减产、库存去化
  - 价格侧：产品价格中枢持续上涨、合约价/现货价上调、涨价函、降价、价格战
  - 需求侧：需求旺盛、行业高景气上行、市场超预期拓展、订单饱满、新品上市持续超预期、份额提升
  - 反向信号：供过于求、供给过剩、需求疲软、砍单、库存高企、以价换量
  只记录原文确有支撑的表述，禁止推断；无此类信息时保持 facts 为空扩展、不含臆测词。

